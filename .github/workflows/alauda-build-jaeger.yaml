name: Alauda Build Jaeger

on:
  pull_request:
    paths:
      - "cmd/jaeger/**"
      - "cmd/es-rollover/**"
      - "cmd/es-index-cleaner/**"
      - "internal/**"
      - "alauda/jaeger-cluster-plugin/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/alauda-build-jaeger.yaml"
      # 排除所有 Markdown 文件。注意：pull_request 的 paths 按整个 PR 的 diff 评估（而非
      # 单次 push 改动的文件），只要 PR 整体含匹配文件，之后每次 push（含纯文档提交）都会重触发
      - "!**.md"
  push:
    tags:
      # 集群插件发布 tag（如 plugin-v2.1.0-r0）；
      # 带 plugin- 前缀以与上游 Jaeger 版本 tag（v2.16.0 等）区分，
      # 避免干扰 scripts/utils/compute-version.sh 基于 git tag 的版本推导
      - "plugin-v*-r*"
  workflow_dispatch:
    inputs:
      epoch:
        description: Release epoch（插件版本的 rN 序号，chart 版本 = Chart.yaml version 的 X.Y.Z + -r<epoch>）
        required: true
        type: number
        default: 0

run-name: >-
  ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && format('Manual build (epoch={0})', inputs.epoch) ||
      format('PR #{0}', github.event.pull_request.number) }}

env:
  GOPROXY: "https://goproxy.cn,direct"
  PLATFORMS: linux/amd64,linux/arm64
  IMG_PREFIX: build-harbor.alauda.cn/asm

permissions:
  contents: read

jobs:
  determine-version:
    name: Determine versions
    runs-on: ubuntu-latest

    outputs:
      # 上游 Jaeger 版本（如 2.16.0），事实源为 Chart.yaml 的 appVersion
      app_version: ${{ steps.versions.outputs.app_version }}
      # 集群插件 chart 版本（如 v2.1.0-r0），发布时由 plugin-v* tag 驱动
      chart_version: ${{ steps.versions.outputs.chart_version }}
      # Jaeger 镜像 tag = <Jaeger 版本>-<chart 版本去 v 前缀>（如 2.16.0-2.1.0-r0），与 chart 一一对应
      image_tag: ${{ steps.versions.outputs.image_tag }}
      # oauth2-proxy 镜像 tag（第三方镜像，随插件分发，版本独立维护）
      oauth2_proxy_tag: ${{ steps.versions.outputs.oauth2_proxy_tag }}

    steps:
      # 版本全部来自仓库文件与触发 ref，不依赖 git tag 推导，浅克隆即可
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine versions
        id: versions
        env:
          CHART_DIR: alauda/jaeger-cluster-plugin
        run: |
          # 上游 Jaeger 版本：从 Chart.yaml 的 appVersion 读取（同步上游代码时人工更新）
          APP_VERSION=$(sed -nE 's/^appVersion:[[:space:]]*"?([^"]+)"?.*$/\1/p' "${CHART_DIR}/Chart.yaml")
          if ! echo "${APP_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Chart.yaml 的 appVersion 无效：${APP_VERSION}（应为上游 Jaeger 版本，如 2.16.0）"
            exit 1
          fi

          # chart 版本基线（X.Y.Z）：从 Chart.yaml 的 version 读取，用于 PR / 手动触发的派生版本
          CHART_BASE=$(sed -nE 's/^version:[[:space:]]*v?([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' "${CHART_DIR}/Chart.yaml")
          if [ -z "${CHART_BASE}" ]; then
            echo "::error::无法从 Chart.yaml 的 version 解析 chart 版本基线"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            # 发布构建：chart 版本 = git tag 去掉 plugin- 前缀（如 plugin-v2.1.0-r0 → v2.1.0-r0）
            CHART_VERSION="${GITHUB_REF_NAME#plugin-}"
            if ! echo "${CHART_VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$'; then
              echo "::error::发布 tag 格式无效：${GITHUB_REF_NAME}（应为 plugin-vX.Y.Z-rN，如 plugin-v2.1.0-r0）"
              exit 1
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHART_VERSION="v${CHART_BASE}-r${{ inputs.epoch }}"
          else
            CHART_VERSION="v${CHART_BASE}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          fi

          # Jaeger 镜像 tag：同时携带 Jaeger 版本与插件版本，每次插件发版均唯一、不覆盖
          IMAGE_TAG="${APP_VERSION}-${CHART_VERSION#v}"

          # oauth2-proxy 镜像 tag：以 values.yaml 中行尾 "# oauth2-proxy-tag" 标记定位
          OAUTH2_PROXY_TAG=$(sed -nE 's/^[[:space:]]*tag:[[:space:]]*"?([^" ]+)"?[[:space:]]*# oauth2-proxy-tag$/\1/p' "${CHART_DIR}/values.yaml")
          if [ -z "${OAUTH2_PROXY_TAG}" ]; then
            echo "::error::无法从 values.yaml 读取 oauth2-proxy 镜像 tag（缺少 # oauth2-proxy-tag 标记）"
            exit 1
          fi

          echo "::notice::Jaeger 版本: ${APP_VERSION}，chart 版本: ${CHART_VERSION}，镜像 tag: ${IMAGE_TAG}，oauth2-proxy: ${OAUTH2_PROXY_TAG}"
          {
            echo "app_version=${APP_VERSION}"
            echo "chart_version=${CHART_VERSION}"
            echo "image_tag=${IMAGE_TAG}"
            echo "oauth2_proxy_tag=${OAUTH2_PROXY_TAG}"
          } >> "$GITHUB_OUTPUT"

  build-binaries:
    name: Build jaeger, es-rollover and es-index-cleaner binaries - ${{ matrix.arch }}
    runs-on:
      [self-hosted, linux, "${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}"]
    needs: [determine-version]

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    env:
      http_proxy: ${{ vars.http_proxy }}
      https_proxy: ${{ vars.https_proxy }}
      no_proxy: ${{ vars.no_proxy }}

    steps:
      # 二进制版本号由下方 make 命令显式传入（GIT_CLOSEST_TAG），
      # 不再依赖 git tag 推导，无需拉取完整历史与 tags
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      # self-hosted runner 的 _work 工作区跨 run 复用，checkout 只 clean 主仓库，不会清理
      # submodule 内被 gitignore 的文件；jaeger-ui 里残留的旧版 build/ 曾被直接打进新二进制
      - name: Clean submodule workspaces
        run: git submodule foreach --recursive git clean -ffdx

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache: false

      # 不安装 Node.js：同步流程保证 jaeger-ui submodule 始终位于上游 release tag，
      # rebuild-ui.sh 会直接下载预构建 UI 资产（curl），不会走需要 node/pnpm 的源码构建
      - name: Install CI tools
        run: make install-ci

      # 显式重建 UI 资产：make 的 build-ui 依赖只认 jaeger-ui/packages/jaeger-ui/build/index.html
      # 是否存在，残留旧文件会被直接复用；rebuild-ui 为 .PHONY，无条件按 jaeger-ui submodule
      # 当前 release tag 重新下载预构建资产（curl，无需 node）。submodule 为浅克隆时脚本会
      # fetch --unshallow 以识别 tag，首次运行较慢属预期
      - name: Rebuild UI assets
        run: make rebuild-ui

      # GIT_CLOSEST_TAG（二进制内嵌的版本号）显式取上游 Jaeger 版本，
      # 通过 make 命令行赋值覆盖 BuildInfo.mk 中基于 git tag 的默认推导，
      # 避免受 plugin-v* 等非 Jaeger 版本 tag 的干扰
      - name: Build jaeger binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} make build-jaeger \
            GIT_CLOSEST_TAG="v${{ needs.determine-version.outputs.app_version }}" \
            -e LD_EXTRAFLAGS="${LD_EXTRAFLAGS}"
        env:
          SKIP_DEBUG_BINARIES: "1"
          LD_EXTRAFLAGS: ${{ vars.LD_EXTRAFLAGS }}

      # 防御性校验：比对二进制内嵌 UI 资产名单（embed 路径 actual/ 下均带 .gz 后缀）与
      # jaeger-ui 构建产物，拦截"陈旧残留被打进二进制"这类构建成功但产物错误的问题。
      # 内嵌名单在二进制中无分隔符连续存储，正则字符类不能含 /（否则贪婪匹配跨条目）；
      # 按扁平 static 目录设计，若上游资产出现子目录会在此显式失败、提醒调整
      - name: Verify embedded UI assets
        run: |
          BIN="cmd/jaeger/jaeger-linux-${{ matrix.arch }}"
          grep -aq 'actual/index.html.gz' "$BIN"
          diff <(grep -aoE 'actual/static/[A-Za-z0-9._-]+\.gz' "$BIN" | sed 's#^actual/static/##; s#\.gz$##' | sort -u) \
               <(cd jaeger-ui/packages/jaeger-ui/build/static && find . -type f | sed 's#^\./##' | sort)
          echo "内嵌 UI 资产与 jaeger-ui/packages/jaeger-ui/build/static 一致"

      - name: Build es-rollover binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} make build-es-rollover \
            GIT_CLOSEST_TAG="v${{ needs.determine-version.outputs.app_version }}" \
            -e LD_EXTRAFLAGS="${LD_EXTRAFLAGS}"
        env:
          SKIP_DEBUG_BINARIES: "1"
          LD_EXTRAFLAGS: ${{ vars.LD_EXTRAFLAGS }}

      - name: Build es-index-cleaner binary
        run: |
          GOOS=linux GOARCH=${{ matrix.arch }} make build-es-index-cleaner \
            GIT_CLOSEST_TAG="v${{ needs.determine-version.outputs.app_version }}" \
            -e LD_EXTRAFLAGS="${LD_EXTRAFLAGS}"
        env:
          SKIP_DEBUG_BINARIES: "1"
          LD_EXTRAFLAGS: ${{ vars.LD_EXTRAFLAGS }}

      - name: Upload jaeger binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: jaeger-linux-${{ matrix.arch }}
          path: cmd/jaeger/jaeger-linux-${{ matrix.arch }}
          retention-days: 1

      - name: Upload es-rollover binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: es-rollover-linux-${{ matrix.arch }}
          path: cmd/es-rollover/es-rollover-linux-${{ matrix.arch }}
          retention-days: 1

      - name: Upload es-index-cleaner binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: es-index-cleaner-linux-${{ matrix.arch }}
          path: cmd/es-index-cleaner/es-index-cleaner-linux-${{ matrix.arch }}
          retention-days: 1

  build-and-push-images:
    name: Build ${{ matrix.component }} image - ${{ matrix.arch }}
    runs-on:
      [self-hosted, linux, "${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}"]
    needs: [determine-version, build-binaries]

    strategy:
      fail-fast: false
      matrix:
        component: [jaeger, es-rollover, es-index-cleaner]
        arch: [amd64, arm64]

    env:
      http_proxy: ${{ vars.http_proxy }}
      https_proxy: ${{ vars.https_proxy }}
      no_proxy: ${{ vars.no_proxy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to build-harbor.alauda.cn
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.component }}-linux-${{ matrix.arch }}
          path: cmd/${{ matrix.component }}/

      - name: Prepare build context
        run: |
          chmod +x cmd/${{ matrix.component }}/${{ matrix.component }}-linux-${{ matrix.arch }}

      - name: Determine image name and platform tag
        id: image-info
        run: |
          echo "tag=${{ needs.determine-version.outputs.image_tag }}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          # 镜像名称映射：es-rollover -> jaeger-es-rollover，es-index-cleaner -> jaeger-es-index-cleaner，与官方命名保持一致
          case "${{ matrix.component }}" in
            es-rollover)       echo "image_name=jaeger-es-rollover" >> $GITHUB_OUTPUT ;;
            es-index-cleaner)  echo "image_name=jaeger-es-index-cleaner" >> $GITHUB_OUTPUT ;;
            *)                 echo "image_name=${{ matrix.component }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/${{ matrix.arch }}
          context: cmd/${{ matrix.component }}
          file: cmd/${{ matrix.component }}/Dockerfile
          push: true
          # debug_image 添加默认值，避免构建 release target 时报错（下面的 target 已经指定 release，不会构建 debug 镜像）
          build-args: |
            base_image=build-harbor.alauda.cn/mlops/static@sha256:d2185a95c5e553a32e4f82d8138ccb78b57242f987985bd089ae2fb3c21e18d0
            TARGETARCH=${{ matrix.arch }}
          target: release
          tags: |
            ${{ env.IMG_PREFIX }}/${{ steps.image-info.outputs.image_name }}:${{ steps.image-info.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref }}
        env:
          DOCKER_BUILD_SUMMARY: false

  merge-manifests:
    name: Merge ${{ matrix.component }} image manifests
    runs-on: [self-hosted, linux]
    needs: [determine-version, build-and-push-images]

    strategy:
      matrix:
        component: [jaeger, es-rollover, es-index-cleaner]

    env:
      http_proxy: ${{ vars.http_proxy }}
      https_proxy: ${{ vars.https_proxy }}
      no_proxy: ${{ vars.no_proxy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4
        with:
          version: latest-release

      - name: Login to build-harbor.alauda.cn
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine image name
        id: image-name
        run: |
          # 镜像名称映射：es-rollover -> jaeger-es-rollover，es-index-cleaner -> jaeger-es-index-cleaner，与官方命名保持一致
          case "${{ matrix.component }}" in
            es-rollover)       echo "image_name=jaeger-es-rollover" >> $GITHUB_OUTPUT ;;
            es-index-cleaner)  echo "image_name=jaeger-es-index-cleaner" >> $GITHUB_OUTPUT ;;
            *)                 echo "image_name=${{ matrix.component }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Merge image manifests and push
        env:
          TAG: ${{ needs.determine-version.outputs.image_tag }}
          IMAGE_NAME: ${{ steps.image-name.outputs.image_name }}
        run: |
          crane index append \
            -m "${IMG_PREFIX}/${IMAGE_NAME}:${TAG}-amd64" \
            -m "${IMG_PREFIX}/${IMAGE_NAME}:${TAG}-arm64" \
            -t "${IMG_PREFIX}/${IMAGE_NAME}:${TAG}"

  build-cluster-plugin:
    name: Build and push cluster plugin chart
    runs-on: [self-hosted, linux]
    needs: [determine-version, merge-manifests]

    env:
      http_proxy: ${{ vars.http_proxy }}
      https_proxy: ${{ vars.https_proxy }}
      no_proxy: ${{ vars.no_proxy }}
      CHART_DIR: alauda/jaeger-cluster-plugin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Update chart version and jaeger image tags
        env:
          CHART_VERSION: ${{ needs.determine-version.outputs.chart_version }}
          APP_VERSION: ${{ needs.determine-version.outputs.app_version }}
        run: |
          # 写入 chart 版本与上游 Jaeger 版本；3 个 jaeger 镜像 tag 由脚本内部
          # 拼接为 <Jaeger 版本>-<chart 版本去 v 前缀>（与同一流水线构建的镜像一致）
          "${CHART_DIR}/hack/update-version.sh" "${CHART_VERSION}" "${APP_VERSION}"

      - name: Add OCI provenance metadata
        env:
          REF_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          # 替换 Chart.yaml 中 org.opencontainers.image.* provenance 注解的占位符；
          # helm push 时这些注解会同步为 OCI artifact annotations
          sed -i "s|GIT-REVISION-PLACEHOLDER|${{ github.sha }}|" "${CHART_DIR}/Chart.yaml"
          sed -i "s|GIT-REF-NAME-PLACEHOLDER|${REF_NAME}|" "${CHART_DIR}/Chart.yaml"
          grep "org.opencontainers.image" "${CHART_DIR}/Chart.yaml"

      - name: Lint chart
        run: helm lint "${CHART_DIR}"

      - name: Package and push chart
        env:
          CHART_VERSION: ${{ needs.determine-version.outputs.chart_version }}
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | helm registry login build-harbor.alauda.cn \
            --username "${{ secrets.HARBOR_USERNAME }}" --password-stdin
          helm package "${CHART_DIR}"
          # chart 版本带 v 前缀，产物为 jaeger-cluster-plugin-<CHART_VERSION>.tgz，
          # 推送后地址：build-harbor.alauda.cn/asm/jaeger-cluster-plugin:<CHART_VERSION>
          helm push "jaeger-cluster-plugin-${CHART_VERSION}.tgz" oci://build-harbor.alauda.cn/asm

  # 汇总输出本次流水线的全部产物：
  #   - 3 个本流水线构建的 Jaeger 镜像 + 随插件分发的第三方 oauth2-proxy 镜像
  #   - 集群插件 chart（OCI artifact）
  output-images:
    name: Output images
    runs-on: ubuntu-latest
    needs: [determine-version, merge-manifests, build-cluster-plugin]

    outputs:
      images: ${{ steps.output-images.outputs.images }}
      chart: ${{ steps.output-images.outputs.chart }}

    steps:
      - name: Output images and chart
        id: output-images
        env:
          IMAGES: >-
            ${{ format('["{0}/jaeger:{1}","{0}/jaeger-es-rollover:{1}","{0}/jaeger-es-index-cleaner:{1}","{0}/oauth2-proxy:{2}"]', env.IMG_PREFIX, needs.determine-version.outputs.image_tag, needs.determine-version.outputs.oauth2_proxy_tag) }}
          CHART: ${{ format('{0}/jaeger-cluster-plugin:{1}', env.IMG_PREFIX, needs.determine-version.outputs.chart_version) }}
        run: |
          echo "BUILD_IMAGES=${IMAGES}"
          echo "BUILD_CHART=${CHART}"
          echo "images=${IMAGES}" >> "$GITHUB_OUTPUT"
          echo "chart=${CHART}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo
            echo "$IMAGES" | jq -r '.[] | "- `\(.)`"'
            echo
            echo "### Cluster plugin chart"
            echo
            echo "- \`${CHART}\`"
          } >> "$GITHUB_STEP_SUMMARY"
