  description:
    en: Alauda Distributed Tracing records how a single request travels across services in a distributed application. It helps teams follow request paths end to end, understand latency across service boundaries, and troubleshoot failures in cloud-native microservice environments.
    zh: Alauda Distributed Tracing（分布式追踪）记录单个请求在分布式应用中跨服务的完整流转路径，帮助团队端到端地跟踪请求路径、了解跨服务边界的延迟，并排查云原生微服务环境中的故障。
  logo: data:image/svg+xml;base64,
  mainChart: asm/jaeger-cluster-plugin
  name: jaeger-cluster-plugin
  upgradeRiskLevel: low
