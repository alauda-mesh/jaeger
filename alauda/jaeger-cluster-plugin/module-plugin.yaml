apiVersion: cluster.alauda.io/v1alpha1
kind: ModulePlugin
metadata:
  annotations:
    cpaas.io/built-in-plugin: "false"
    cpaas.io/display-name: '{"en": "Alauda Build of Jaeger v2", "zh": "Alauda Build of Jaeger v2"}'
    cpaas.io/module-name: jaeger-cluster-plugin
  labels:
    cpaas.io/module-catalog: servicemesh
    cpaas.io/module-name: jaeger-cluster-plugin
    cpaas.io/module-type: plugin
    cpaas.io/product: distributed-tracing
  name: jaeger-cluster-plugin
spec:
  appReleases:
  - chartVersions:
    - name: asm/jaeger-cluster-plugin
      releaseName: jaeger-cluster-plugin
      version: v2.1.0-r0
    name: jaeger-cluster-plugin
