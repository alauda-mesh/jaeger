apiVersion: cluster.alauda.io/v1alpha1
kind: ModulePlugin
metadata:
  annotations:
    cpaas.io/built-in-plugin: "false"
    cpaas.io/display-name: '{"en": "Alauda Build of Jaeger v2", "zh": "Alauda Build of Jaeger v2"}'
    cpaas.io/module-name: jaeger-cluster-plugin
  labels:
    cpaas.io/module-catalog: servicemesh
    cpaas.io/module-name: jaeger-cluster-plugin
    cpaas.io/module-type: plugin
    cpaas.io/product: devops
  name: jaeger-cluster-plugin
spec:
  appReleases:
  - chartVersions:
    - name: asm/jaeger-cluster-plugin
      releaseName: jaeger-cluster-plugin
      version: v2.16.0-r2
    name: jaeger-cluster-plugin
  deleteable: true
  description:
    en: Ships the container images required by Alauda Distributed Tracing, including Jaeger (jaeger / jaeger-es-rollover / jaeger-es-index-cleaner) and OAuth2 Proxy. Installing the plugin synchronizes these images to the platform's built-in registry and creates the ConfigMap jaeger-cluster-plugin-manifest (image addresses and version) in the cpaas-system namespace, from which the Alauda Distributed Tracing installation reads the image addresses.
    zh: 随插件下发 Alauda Distributed Tracing 所需的容器镜像，包括 Jaeger（jaeger / jaeger-es-rollover / jaeger-es-index-cleaner）与 OAuth2 Proxy。安装后镜像会同步到平台内置镜像仓库，并在 cpaas-system 命名空间创建 ConfigMap jaeger-cluster-plugin-manifest（含镜像地址与版本），供安装 Alauda Distributed Tracing（调用链）时读取镜像地址。
  logo: data:image/svg+xml;base64,
  mainChart: asm/jaeger-cluster-plugin
  name: jaeger-cluster-plugin
  upgradeRiskLevel: low
